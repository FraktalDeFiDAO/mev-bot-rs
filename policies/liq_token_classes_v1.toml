# Pinned token classification registry for the liquidation feature contract
# (copper_liq_features_v1, JEV-LIQ-007). Anything not listed classifies as `unknown`.
#
# Provenance: addresses are the Arbitrum One token addresses already pinned in
# config/arbitrum.toml [tokens] (owner-reviewed; not re-fetched on-chain by this change).
# Classes are a coarse economic grouping assigned by the maintainer:
#   stablecoin             - USD-pegged
#   volatile_eth_correlated - ETH or ETH liquid-staking/restaking derivatives
#   volatile_btc_correlated - BTC wrappers
#   other_volatile         - everything else listed
# Changing a class or adding an asset changes feature values: bump `registry_version`
# and rebaseline any cached advisory results.

