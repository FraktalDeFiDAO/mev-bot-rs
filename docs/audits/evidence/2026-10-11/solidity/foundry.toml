[profile.default]
src = "src"
test = "test"
out = "/tmp/mev-audit-solidity-out"
cache_path = "/tmp/mev-audit-solidity-cache"
libs = ["../../../../../contracts/lib"]
remappings = ["forge-std/=/workspace/contracts/lib/forge-std/src/", "audit-contracts/=/workspace/contracts/"]
allow_paths = ["/workspace/contracts"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
