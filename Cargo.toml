[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
alloy = { version = "2.5", features = ["essentials", "provider-ws", "pubsub", "rpc-types", "sol-types", "network", "consensus", "json-rpc"] }
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
futures = "0.3"
dotenvy = "0.15"
clap = { version = "4.6", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
proptest = "1.11"
tower = "0.5"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
base64 = "0.23"
brotli-decompressor = "6"
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio-util = { version = "=0.7.19", default-features = false }
httpdate = "=1.0.3"
rusqlite = { version = "0.41", features = ["bundled", "hooks", "limits"] }
redb = "4.3"

seqscope-core = { path = "crates/seqscope-core" }
seqscope-store = { path = "crates/seqscope-store" }
seqscope-server = { path = "crates/seqscope-server" }
seqscope-cli = { path = "crates/seqscope-cli" }
mev-types = { path = "crates/mev-types" }
mev-config = { path = "crates/mev-config" }
mev-bindings = { path = "crates/mev-bindings" }
mev-rpc = { path = "crates/mev-rpc" }
mev-ingest = { path = "crates/mev-ingest" }
mev-dex = { path = "crates/mev-dex" }
mev-discovery = { path = "crates/mev-discovery" }
mev-lending = { path = "crates/mev-lending" }
mev-lending-index = { path = "crates/mev-lending-index" }
mev-liq-state = { path = "crates/mev-liq-state" }
mev-liq-features = { path = "crates/mev-liq-features" }
mev-liq-sched = { path = "crates/mev-liq-sched" }
mev-lending-spark = { path = "crates/mev-lending-spark" }
mev-lending-radiant = { path = "crates/mev-lending-radiant" }
mev-lending-gearbox = { path = "crates/mev-lending-gearbox" }
mev-lending-dolomite = { path = "crates/mev-lending-dolomite" }
mev-lending-morpho = { path = "crates/mev-lending-morpho" }
mev-lending-moonwell = { path = "crates/mev-lending-moonwell" }
mev-lending-fluid = { path = "crates/mev-lending-fluid" }
mev-lending-exactly = { path = "crates/mev-lending-exactly" }
mev-lending-euler = { path = "crates/mev-lending-euler" }
mev-lending-compound-v3 = { path = "crates/mev-lending-compound-v3" }
mev-lending-silo = { path = "crates/mev-lending-silo" }
mev-lending-aave-v3 = { path = "crates/mev-lending-aave-v3" }
mev-oracle = { path = "crates/mev-oracle" }
mev-state = { path = "crates/mev-state" }
mev-sim = { path = "crates/mev-sim" }
mev-search = { path = "crates/mev-search" }
mev-liquidate = { path = "crates/mev-liquidate" }
mev-risk = { path = "crates/mev-risk" }
mev-exec = { path = "crates/mev-exec" }
mev-metrics = { path = "crates/mev-metrics" }
mev-analytics = { path = "crates/mev-analytics" }
mev-engine = { path = "crates/mev-engine" }
mev-sequencer = { path = "crates/mev-sequencer" }
mev-presim = { path = "crates/mev-presim" }
mev-outcomes = { path = "crates/mev-outcomes" }
mev-decode = { path = "crates/mev-decode", default-features = false }
mev-protocol = { path = "crates/mev-protocol" }
mev-protocol-uniswap-v2 = { path = "crates/mev-protocol-uniswap-v2" }
mev-protocol-uniswap-v3 = { path = "crates/mev-protocol-uniswap-v3" }
mev-protocol-uniswap-v4 = { path = "crates/mev-protocol-uniswap-v4" }
mev-protocol-uniswap-router = { path = "crates/mev-protocol-uniswap-router" }
mev-protocol-pancake-v3 = { path = "crates/mev-protocol-pancake-v3" }
mev-protocol-balancer = { path = "crates/mev-protocol-balancer" }
mev-protocol-aave-v3 = { path = "crates/mev-protocol-aave-v3" }
mev-protocol-morpho-blue = { path = "crates/mev-protocol-morpho-blue" }
mev-protocol-compound-v3 = { path = "crates/mev-protocol-compound-v3" }
mev-protocol-dolomite = { path = "crates/mev-protocol-dolomite" }
mev-protocol-unidentified = { path = "crates/mev-protocol-unidentified" }
mev-protocol-fluid = { path = "crates/mev-protocol-fluid" }
mev-protocol-oneinch = { path = "crates/mev-protocol-oneinch" }
mev-protocol-cow = { path = "crates/mev-protocol-cow" }
mev-protocol-aerodrome = { path = "crates/mev-protocol-aerodrome" }
mev-protocol-camelot = { path = "crates/mev-protocol-camelot" }
mev-protocol-sushi = { path = "crates/mev-protocol-sushi" }
mev-protocol-paraswap = { path = "crates/mev-protocol-paraswap" }
mev-protocol-kyber = { path = "crates/mev-protocol-kyber" }
mev-atlas = { path = "crates/mev-atlas" }
mev-localsim = { path = "crates/mev-localsim" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# The exact swap math runs millions of 256/512-bit operations in the test matrices; optimise just the
# integer library, the swap models and the route search in debug builds so `cargo test` stays fast.
[profile.dev.package.ruint]
opt-level = 3

[profile.dev.package.mev-dex]
opt-level = 3

[profile.dev.package.mev-search]
opt-level = 3

[profile.dev.package.mev-state]
opt-level = 3
