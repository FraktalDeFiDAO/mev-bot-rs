# Secret scanning config. All of gitleaks' default rules stay on; the one exception below is deliberate and narrow.
title = "mev-bot gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Public Arbitrum token contract addresses (USDC, USDC.e, USDT, WETH, WBTC, ARB, DAI, GMX): on-chain data that appears in seqscope's token table, its tests and its examples. They look like keys to the generic-api-key rule when written as `token_in == 0x...`. The RFC 6455 sample WebSocket handshake key (base64 of the text 'the sample nonce'), used by infra/arbitrum-node/arbitrum-status to probe a local port. The dummy key `0123456789abc` in mev-metrics' test that RPC keys are redacted from event logs (crates/mev-metrics/src/jsonl.rs). Nothing else is allowlisted."
regexes = [
  '''(?i)(0x)?(af88d065e77c8cC2239327C5EDb3A432268e5831|FF970A61A04b1cA14834A43f5dE4533eBDDB5CC8|Fd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9|82aF49447D8a07e3bd95BD0d56f35241523fBab1|2f2a2543B76A4166549F7aaB2e75Bef0aefC5B0f|912CE59144191C1204E64559FE8253a0e49E6548|DA10009cBd5D07dd0CeCc66161FC93D7c9000da1|fc5A1A6EB076a2C7aD06eD22C90d7E710E35ad0a)''',
  '''dGhlIHNhbXBsZSBub25jZQ==''',
  '''^0123456789abc$''',
]
