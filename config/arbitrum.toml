max_gas_usd_per_day = 3.0
max_consecutive_failures = 10
max_loan_usd = 50000.0
max_concurrent_sends = 3      # arbs on disjoint pools; 7 profitable opps were dropped behind one in-flight tx (2026-10-05)
arb_presimulate = true        # every live arb is eth_called through the executor first. Sending on the model alone lost $2 in an hour (2026-10-07, DECISIONS #75): with tick maps most routes count as exact, and 7 of 8 model-only sends would already have reverted one block earlier
fast_send = false            # OFF (owner, 2026-10-08, DECISIONS #93): 106 sends in ~5 h, 0 succeeded, daily gas cap hit twice. Skips every pre-send eth_call when true; the checks stay configured

[pga]
# Priority-fee (tip) spend caps, USD. Daily gas stays capped by [risk] max_gas_usd_per_day.
max_fraction_of_net = 0.5      # share of expected net spendable on one tip (was 0.3)
max_tip_usd_per_tx = 1.00      # one bid (still limited by max_fraction_of_net of expected net)
max_tip_usd_per_minute = 5.00  # rolling minute
max_tip_usd_per_day = 25.00    # per UTC day
default_tip_gwei = 0.05        # bid when no competition is observed (was 0.005: lost to 0-3 gwei winners)
outbid_margin = 0.25           # bid 25% above the competition estimate (was 10%)
competition_quantile = 0.9     # of a route's own recent winner tips (was 0.75)
route_min_observations = 3    # winners seen on a route before it is priced from them alone
market_quantile = 0.5         # routes with less history: the MEDIAN of all winners and bot-like feed tips. The market is bimodal (about 40 % of races won by ~0 tips, a fifth by 0.3-3 gwei); a network-wide p90 of 1 gwei priced every route out (2026-10-07: 12 of 27 profitable trades skipped)
feed_min_bot_tip_gwei = 0.02   # ignore feed txs tipping less: ordinary wallets (~0.01 gwei), not bots
min_tip_gwei = 0.01            # never bid below this (a 1-wei bid is a zero bid)

[uniswap_v4]
# Hookless Uniswap V4 pools (95 % of V4 swap activity; half of it on native-ETH pools, which the
# executor unwraps). Found from the PoolManager's Initialize events (cached in data/arbitrum/v4_pools.json)
# and ranked by recent swaps. Routes through them are only SENT once the deployed executor has V4 hops
# (`executor_v4 = true` at the top, after `scripts/deploy-executor.sh --redeploy`); until then they are
# logged as `v4_candidate` events, which measures what V4 would offer.
enabled = true
pool_manager = "0x360E68faCcca8cA495c1B759Fd9EEe466db9FB32"
log_rpc = "https://arb1.arbitrum.io/rpc"
first_block = 250000000   # before the manager's deployment (first pool: block 298,076,243)
blocks = 72000            # swap-activity window (~5 h; was 12000 = ~50 min: 82 of 4,292 hookless pools active in it)
step = 500
min_swaps = 1             # swaps in the window to be tracked (was 3: ~52 pools; 1 tracks every pool that swapped)
max_pools = 400
presimulate = true        # eth_call every route through a V4 pool before sending it (optional; costs one call per candidate)

[gate]
# Per-route win-rate gate for arbitrage sends (DECISIONS #54). A loss costs gas plus a tip, so a route
# is sent only while p_win x net - (1 - p_win) x cost > 0. p_win is the route's own record smoothed
# toward the global one; every route gets min_attempts tries first; losing streaks back it off.
enabled = true
min_attempts = 3
prior_strength = 5.0
prior_floor = 0.02
backoff_after = 3        # consecutive losses
backoff_secs = 600       # first back-off, doubled per further loss
backoff_max_secs = 21600
memory_secs = 86400      # results older than this are forgotten
global_min_attempts = 30 # no win in this many sends across ALL routes: stop arbitrage sends (DECISIONS #132); 0 = off
global_probe_secs = 3600 # while stopped, one probe send per hour so a market that changed is noticed
[ticks]
enabled = true          # price V3/Pancake swaps across tick boundaries (optional; false = one-bucket model)
window_ticks = 800      # ticks loaded each side of the price (~8 %)
refresh_secs = 300

[batch]
# Several ready liquidations/arbitrages as ONE transaction via the executor's `batch` (one nonce, one
# tip and base fee for the lot; each trade still succeeds or fails on its own). OFF until the executor
# with `batch` is deployed and `executor_batch = true` is set at the top of this file.
enabled = false
window_ms = 15     # how long the first queued trade waits for company
max_items = 4      # flush at once at this many (the executor allows 8)

[atlas]
# Optional Chainlink SVR / FastLane Atlas solver (docs/research/ATLAS.md). Observing only: bids are off.
# enabled = true  -> listen to the auction feed and log the auctions on this chain (free, no funds)
# bid     = true  -> also submit solver operations (needs the steps in scripts/atlas-solver.sh)
enabled = true     # observe only: log the auctions on this chain (no funds, no bids)
bid = false
# solver = "0x..."           # the deployed AtlasSolver (scripts/atlas-solver.sh deploy)
bid_fraction = 0.7           # share of a liquidation's expected net profit offered as the bid
max_bid_eth = 0.01           # per-bid cap; keep equal to the contract's maxBid
solver_gas_limit = 1500000   # used if DappControl.getSolverGasLimit() cannot be read

