name = "arbitrum"
chain_id = 42161
balancer_vault = "0xBA12222222228d8Ba445958a75a0704d566BF2C8"
# Raw txs also go straight to the Arbitrum sequencer (fastest path, no API key needed).
sequencer_rpc = "https://arb1-sequencer.arbitrum.io/rpc"
# Real-time stream of sequenced txs (free; ~0.9 s ahead of RPC receipts).
sequencer_feed = "wss://arb1.arbitrum.io/feed"
min_pool_liquidity_usd = 2500.0   # was 5000: thin long-tail pools are where few bots look
max_cycles = 200000               # was 100000, 20000 before: a wider pool set means more triangles; the cap still bounds search memory
gas_limit_estimate = 1500000
# Executors since 0x5932C0887173B7E9C4258EaCaB2bAc395137CB29 (2026-10-05) have executeFlashSwap: V3-first routes
# borrow from their first pool (no fee, no Balancer cap). DECISIONS #46.
executor_flash_swaps = true
# Executor 0xb793f66e4e3D1fFfd7c095E3AC2D863BfBB336A2 (2026-10-05) adds liquidateViaAave: liquidations above
# the Balancer cap borrow from the Aave pool (5 bps). DECISIONS #51.
executor_aave_flash = true
executor_batch = true    # the deployed executor (0x17357E33..., 2026-10-06) has `batch`; see [batch]
executor_v4 = true       # the deployed executor has Uniswap V4 hops and its PoolManager set; see [uniswap_v4]
loan_tokens = ["WETH", "USDC", "USDT", "WBTC", "ARB", "DAI", "USDC.e"]
usd_token = "USDC"
native_token = "WETH"

pairs = [
  ["WETH", "USDC"], ["WETH", "USDC.e"], ["WETH", "USDT"], ["WETH", "DAI"], ["WETH", "WBTC"],
  ["WETH", "ARB"], ["WETH", "GMX"], ["WETH", "LINK"], ["WETH", "PENDLE"], ["WETH", "UNI"],
  ["ARB", "USDC"], ["ARB", "USDT"], ["WBTC", "USDC"], ["WBTC", "USDT"], ["USDC", "USDT"],
  ["USDC", "USDC.e"], ["USDC", "DAI"], ["GMX", "USDC"], ["LINK", "USDC"], ["PENDLE", "USDC"],
  # Aave collateral/debt seen in the 2025-10-10/11 crash with no route (135 of 907 liquidations).
  ["wstETH", "WETH"], ["weETH", "WETH"], ["rETH", "WETH"], ["AAVE", "WETH"], ["AAVE", "USDC"],
  ["GHO", "USDC"],
]

[auto_discovery]
enabled = true
blocks = 72000           # ~5 h of Arbitrum blocks (was 12000 = 50 min, then 2400): the 50-minute scan found only 91 tokens, so steady-but-quiet pairs (RLC, LPT, PEAR, WINR, ...) never entered; 16% of swap activity was on pools we did not hold (DECISIONS #105)
step = 200
log_rpc = "https://arb1.arbitrum.io/rpc"   # official RPC allows wide getLogs ranges
pair_with = ["WETH", "USDC", "USDT", "ARB", "WBTC", "DAI"]   # more bases: more triangles
max_tokens = 300         # was 150
cross_pairs = 14         # X/Y pools among the 14 most active long-tail tokens (L -> X -> Y -> L)

[liquidation]
enabled = true
scan_rpc = "https://arb1.arbitrum.io/rpc"                # only public RPC verified to return complete wide getLogs
sweep_rpc = "https://arbitrum-one-rpc.publicnode.com"    # heavy health sweeps (eth_call only)
# Sweeps rotate across these too, falling through on rate limits (PublicNode alone hit -32005).
sweep_rpc_fallbacks = ["https://arbitrum-one.public.blastapi.io", "https://arb1.arbitrum.io/rpc", "https://arbitrum.drpc.org"]   # serve eth_call (meowrpc does not); dRPC back since local sim is off (DECISIONS #45); keyed ARBITRUM_SWEEP_URL_n from .env go first
at_risk_hf = 1.05
min_debt_usd = 20.0              # bonus on less won't cover gas
sweep_secs = 300
fallback_poll_secs = 30          # sequencer price-feed triggers are the fast path
route_via = ["WETH", "USDC", "USDT"]
# revm_shadow = false   # shadow only: also simulate the exact final calldata with REVM and log it vs eth_call (JEV-LIQ-015)

# Shadow-only liquidation pipeline (trigger indexer + snapshot refresh + mandatory-schedule record). Never plans or sends.
[liquidation_shadow]
# Off: with ~188k indexed Aave borrowers the shadow scheduler loads every borrower each tick and
# drove the bot past 1.6 GB RSS on the 2 GB host (15 OOM restarts after deploy-20261014-030250).
# Re-enable only after the input is bounded (minimum-debt cutoff, incremental scheduling).
enabled = false
# snapshot_db = "<data-dir>/liq-state.sqlite"   # default
recheck_concurrency = 4
recheck_budget_per_minute = 30   # ~2 RPC calls each on the fast RPC; raise only after measuring quota use
max_account_age_seconds = 300
tick_ms = 5000

