# Feed-driven arbitrage: simulate sequencer-feed txs (eth_simulateV1) to see the pools they move
# a block early. Endpoint order measured on the us-east-2 host (2026-10-05): arb1 first gives mean
# 70 ms (it rate-limits but absorbs load); without it PublicNode rate-limits more and calls fall
# through to dRPC: mean 98-116 ms and 2-8x the timeouts.
[journal]
pool_events = true   # every event on every tracked pool, every block -> poolevents-DATE.jsonl (DECISIONS #107)
keep_days = 7

[presim]
enabled = true
rpc_urls = ["https://arb1.arbitrum.io/rpc", "https://arbitrum-one-rpc.publicnode.com"]   # not dRPC: reserved for diffs
max_in_flight = 32   # 16 skipped ~23 % of candidates as busy (2026-10-05); keyed Chainstack endpoints take the load
rollback_unconfirmed = false   # presim state no real log confirmed within 3 s: false = only record what would be rolled back (DECISIONS #86); the resync then shows if it was right
record_feed = true   # keep candidate feed txs + what we decoded + presim outcome in data/arbitrum/feedtx-DATE.jsonl for analysis (DECISIONS #90)
record_keep_days = 7
chain_sample_every = 4   # fetch receipts of every 4th block (~1 eth_getBlockReceipts/s) -> chaintx-DATE.jsonl: revert rates, gas, block position, swap/liquidity/liquidation events; 0 = off (DECISIONS #91)
timeout_ms = 250
# In-process simulation (revm, mev-localsim): every feed tx runs locally on a state cache kept
# exact by per-block prestate diffs; rpc_urls above only serve candidates not cached yet.
local = false   # measured 2026-10-05: ~7 % of feed txs complete locally, ~0 pool movers (first-sight keys); enable with an own node (DECISIONS #45)
# dRPC is the only free endpoint serving debug_traceBlockByNumber (prestateTracer). Keyless limit:
# 120k CU/min per IP; diffs use ~22k at ~4 blocks/s. Nothing else may use it (fills got us 429'd).
diff_rpc_urls = ["https://arbitrum.drpc.org"]
fill_rpc_urls = ["https://arbitrum-one-rpc.publicnode.com", "https://arbitrum-one.public.blastapi.io"]   # eth_getProof per address; not arb1 (presim primary, same IP)
