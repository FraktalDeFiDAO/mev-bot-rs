# ---------------------------------------------------------------- RPC providers (primary first)

[providers.chainstack_primary]
role = "PRIMARY RPC (reads, WS logs/subscriptions, tx broadcast)"
plan = "Chainstack $49/month, enough for rigorous testing"
ws_env = "ARBITRUM_WS_URL"         # value in .env on every host (key is in the URL path)
http_env = "ARBITRUM_HTTP_URL"     # same host, https scheme
host = "arbitrum-mainnet.core.chainstack.com"
notes = "Former primary(ies) kept as ARBITRUM_HTTP_URL_2.. / ARBITRUM_WS_URL_2.. fail-over. Key is a secret: never commit."

[providers.chainstack_keyed_extras]
role = "heavy sweeps / presim (eth_simulateV1) / WS fallbacks"
env = "ARBITRUM_SWEEP_URL_n, ARBITRUM_PRESIM_URL_n, ARBITRUM_WS_FALLBACK_n"

[providers.sequencer_feed]
role = "real-time tx feed (free, our biggest edge)"
url = "wss://arb1.arbitrum.io/feed"

[providers.public_fallbacks]
role = "health sweeps / log backfill / last resort"
endpoints = ["PublicNode", "dRPC free", "BlastAPI", "arb1.arbitrum.io/rpc (historical logs, rate-limits our IP)"]

[providers.github]
role = "deploy source: servers fetch with a read-only deploy key (ssh alias github-mev-bot)"
