name = "base"
chain_id = 8453
# Base: plain (non-auction) liquidations only (docs/research/liq-competition-2026-10-15.md, DECISIONS #175):
# Moonwell and the non-SVR Morpho Blue markets are won by ordinary bots; Base Aave is 91% SVR auctions.
# Shadow only until the evidence says we would win. Runs on free public RPCs: no keyed BASE_* endpoints needed.
balancer_vault = "0xBA12222222228d8Ba445958a75a0704d566BF2C8"
# No Arbitrum-style sequencer feed on Base; Flashblocks streams each 2 s block in ~200 ms parts (Brotli JSON, free).
# Transactions to the price feeds the adapters watch trigger an immediate re-check, as on Arbitrum.
flashblocks_feed = "wss://mainnet.flashblocks.base.org/ws"
# Raw transactions also go straight to Base's sequencer (send-only: every other method is "not allowed",
# checked 2026-10-16), skipping the public RPC hop, as Arbitrum's `sequencer_rpc` does.
sequencer_rpc = "https://mainnet-sequencer.base.org"
# Health re-checks read the block being built (`pending`, ~200 ms fresh) instead of the last sealed block
# (`latest`, up to 2 s old): over half of Moonwell's wins follow no Chainlink update, so polling is the
# only detection there (scripts/liq-winners.py, 2026-10-16).
pending_reads = true
min_pool_liquidity_usd = 5000.0
max_cycles = 20000
# Flash loans: Balancer's Base vault is thin (cbBTC ~$900, no wstETH), so loans it cannot fund come from Aave V3's
# Base pool (5 bps; pool and premium checked on-chain 2026-10-16). Aave liquidations themselves stay off (SVR).
executor_aave_flash = true
# V4 hops: the virtual executor gets the PoolManager below; a deployed one needs `setPoolManager`
# (scripts/deploy-executor.sh does it). The bot checks this at startup.
executor_v4 = true
# No executor is deployed on Base: shadow simulates each liquidation and arbitrage against the executor
# built from contracts/src, injected with an eth_call state override, so the logs say what it would have
# earned (liq_sim_ok / sim_ok, or the revert) instead of only `liq_candidate` / `candidate`. Sends nothing.
shadow_virtual_executor = true
# The virtual executor is this repo's source, which has `executeFlashSwap`: arbitrage simulations borrow
# from the route's first pool instead of Base's thin Balancer vault. Base arbitrage is measured, not sent:
# 2,458 candidates on 2026-10-17/18 had a model-estimated $2,853 (p50 $0.24, 102 above $5), and a 2026 study
# of Base under Flashblocks finds ~80% of arbitrage opportunities have a single searcher.
executor_flash_swaps = true
aave_flash_pool = "0xA238Dd80C259a72e81d7e4664a9801593F98d1c5"
loan_tokens = ["WETH", "USDC", "cbBTC"]
usd_token = "USDC"
native_token = "WETH"

pairs = [
  ["WETH", "USDC"], ["WETH", "cbBTC"], ["cbBTC", "USDC"], ["WETH", "wstETH"], ["WETH", "cbETH"],
  ["WETH", "weETH"], ["WETH", "AERO"], ["AERO", "USDC"], ["USDC", "USDbC"], ["USDC", "EURC"],
  ["USDC", "DAI"], ["USDC", "USDT"], ["WETH", "WELL"],
]

# Every endpoint answered an eth_call on 2026-10-15; ordered by latency at runtime (mev-rpc rotate).
# 1rpc added 2026-10-19 (pending 200-call multicall and state overrides answered); widens the pool the
# health polls rotate over: in the 2026-10-17 21:32 crash every endpoint rate-limited at once.
http_fallbacks = ["https://mainnet.base.org", "https://base.gateway.tenderly.co", "https://base-mainnet.public.blastapi.io", "https://base.drpc.org", "https://base-pokt.nodies.app", "https://base-rpc.publicnode.com", "https://base.api.pocket.network", "https://1rpc.io/base"]
# Both held newHeads + logs subscriptions for 40 s on 2026-10-16. No dRPC: from 2026-10-16 its WS
# closes every connection ~1 s after the handshake (code 1006), and alloy's pubsub then redials it
# about four times a second instead of failing over.
ws_fallbacks = ["wss://base.gateway.tenderly.co", "wss://base-rpc.publicnode.com"]

# No [auto_discovery]: it needs wide getLogs, and no free Base endpoint serves more than 10,000 blocks per request.

[liquidation]
enabled = true
# Pocket is the only free Base endpoint found serving full-history getLogs (2026-10-15, re-checked 2026-10-25), at
# most 500 blocks per query since 2026-10-25 (50,000 before; a first back-fill of Aave or Compound from 2023 is
# ~100k queries, about a day at the indexer's throttle). Others, 2026-10-25: PublicNode wants a token for history,
# dRPC 10,000 blocks, Tatum 100, 1rpc 50, Tenderly / nodies "range too large", mainnet.base.org "request limit reached".
scan_rpc = "https://base.api.pocket.network"
sweep_rpc = "https://mainnet.base.org"
# The 21:35 and 21:36 sweeps of the 2026-10-17 crash failed with every endpoint answering 429/403;
# PublicNode and 1rpc added 2026-10-19 (both answer 200-call `pending` multicalls). A dedicated
# endpoint (even a free keyed tier) is the real fix: public limits are per IP and tighten in a crash.
sweep_rpc_fallbacks = ["https://base.gateway.tenderly.co", "https://base-mainnet.public.blastapi.io", "https://base.drpc.org", "https://base-pokt.nodies.app", "https://base-rpc.publicnode.com", "https://1rpc.io/base"]
at_risk_hf = 1.05
min_debt_usd = 20.0
sweep_secs = 300
fallback_poll_secs = 4          # every 2 Base blocks; Flashblocks price-feed triggers are the fast path
# RPC receipt visibility after the flashblock, p50 / p90 / max (measure_rpc_visibility_after_flashblock,
# mainnet.base.org, measured from Europe 2026-10-23; re-measure where the bot runs).
burst_offsets_ms = [138, 187, 437]
route_via = ["WETH", "USDC", "cbBTC"]

