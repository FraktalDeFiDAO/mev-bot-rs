name = "base"
chain_id = 8453
# Base: plain (non-auction) liquidations only (docs/research/liq-competition-2026-10-15.md, DECISIONS #175):
# Moonwell and the non-SVR Morpho Blue markets are won by ordinary bots; Base Aave is 91% SVR auctions.
# Shadow only until the evidence says we would win. Runs on free public RPCs: no keyed BASE_* endpoints needed.
balancer_vault = "0xBA12222222228d8Ba445958a75a0704d566BF2C8"
# No Arbitrum-style sequencer feed on Base; Flashblocks streams each 2 s block in ~200 ms parts (Brotli JSON, free).
# Transactions to the price feeds the adapters watch trigger an immediate re-check, as on Arbitrum.
flashblocks_feed = "wss://mainnet.flashblocks.base.org/ws"
min_pool_liquidity_usd = 5000.0
max_cycles = 20000
gas_limit_estimate = 1500000
loan_tokens = ["WETH", "USDC", "cbBTC"]
usd_token = "USDC"
native_token = "WETH"

pairs = [
  ["WETH", "USDC"], ["WETH", "cbBTC"], ["cbBTC", "USDC"], ["WETH", "wstETH"], ["WETH", "cbETH"],
  ["WETH", "weETH"], ["WETH", "AERO"], ["AERO", "USDC"], ["USDC", "USDbC"], ["USDC", "EURC"],
  ["USDC", "DAI"], ["USDC", "USDT"], ["WETH", "WELL"],
]

# Every endpoint answered an eth_call on 2026-10-15; ordered by latency at runtime (mev-rpc rotate).
http_fallbacks = ["https://mainnet.base.org", "https://base.gateway.tenderly.co", "https://base-mainnet.public.blastapi.io", "https://base.drpc.org", "https://base-pokt.nodies.app", "https://base-rpc.publicnode.com", "https://base.api.pocket.network"]
# Both accepted an eth_subscribe for logs on 2026-10-15 (PublicNode did not answer).
ws_fallbacks = ["wss://base.drpc.org", "wss://base.gateway.tenderly.co"]

# No [auto_discovery]: it needs wide getLogs, and no free Base endpoint serves more than 10,000 blocks per request.

[liquidation]
enabled = true
# Pocket is the only free Base endpoint found (2026-10-15) serving full-history getLogs over wide ranges: up to
# 50,000 blocks, complete (five 10k-block queries summed to the 50k one). Others: BlastAPI 10 blocks, nodies 50,
# dRPC < 500, PublicNode no archive, mainnet.base.org "request limit reached".
scan_rpc = "https://base.api.pocket.network"
sweep_rpc = "https://mainnet.base.org"
sweep_rpc_fallbacks = ["https://base.gateway.tenderly.co", "https://base-mainnet.public.blastapi.io", "https://base.drpc.org", "https://base-pokt.nodies.app"]
at_risk_hf = 1.05
min_debt_usd = 20.0
sweep_secs = 300
fallback_poll_secs = 4          # every 2 Base blocks; Flashblocks price-feed triggers are the fast path
route_via = ["WETH", "USDC", "cbBTC"]

[morpho]
enabled = true
morpho = "0xBBBBBbbBBb9cC5e90e3b3Af64bdAF62C37EEFFCb"
usd_oracle = "0x2Cc0Fc26eD4563A5ce5e8bdcfe1A2878676Ae156"   # Aave V3 Base oracle: loan-token USD prices
from_block = 13977148            # Morpho Blue's Base deployment (first block with code, checked 2026-10-15)
scan_step = 49000                # under Pocket's 50,000-block getLogs cap

[moonwell]
enabled = true
comptroller = "0xfBb21d0380beE3312B33c4353c8936a0F13EF26C"   # Unitroller; 21 markets, close factor 50%, incentive 10%
from_block = 2162390             # first block with the Unitroller's code (checked 2026-10-15)
scan_step = 49000

[risk]
min_profit_usd = 0.05
max_gas_usd_per_day = 3.0
max_consecutive_failures = 10
max_loan_usd = 50000.0
max_concurrent_sends = 1
arb_presimulate = true
fast_send = false

[gate]
# Arbitrage is not the goal on Base; stop it after the first 30 sends with no win (shadow sends nothing).
enabled = true
global_min_attempts = 30
global_probe_secs = 3600

[ticks]
enabled = true
window_ticks = 800
refresh_secs = 300

[atlas]
enabled = false

[journal]
pool_events = false

[tokens]
WETH = "0x4200000000000000000000000000000000000006"
USDC = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
USDbC = "0xd9aAEc86B65D86f6A7B5B1b0c42FFA531710b6CA"
USDT = "0xfde4C96c8593536E31F229EA8f37b2ADa2699bb2"
DAI = "0x50c5725949A6F0c72E6C4a641F24049A917DB0Cb"
EURC = "0x60a3E35Cc302bFA44Cb288Bc5a4F316Fdb1adb42"
cbBTC = "0xcbB7C0000aB88B473b1f5aFd9ef808440eed33Bf"
cbETH = "0x2Ae3F1Ec7F1F5012CFEab0185bfc7aa3cf0DEc22"
wstETH = "0xc1CBa3fCea344f92D9239c08C0568f6F2F0ee452"
weETH = "0x04C0599Ae5A44757c0af6F9eC3b93da8976c150A"
AERO = "0x940181a94A35A4569E4529A3CDfB74e38FD98631"
WELL = "0xA88594D404727625A9437C3f886C7643872296AE"

