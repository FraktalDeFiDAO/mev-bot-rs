[package]
name = "seqscope-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "seqscope core: the rule engine, field model and catalogue for filtering and decoding Arbitrum sequencer transactions. No network, no database, no UI."

[features]
# `Tx::from_sequenced` (pulls in the feed crate). Library users that bring their own transactions turn this off.
default = ["feed"]
feed = ["dep:mev-sequencer"]

[dependencies]
alloy = { workspace = true, features = ["k256"] }
mev-decode = { workspace = true, default-features = false }
mev-protocol = { workspace = true }
mev-sequencer = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
mev-protocol-uniswap-router = { workspace = true }
