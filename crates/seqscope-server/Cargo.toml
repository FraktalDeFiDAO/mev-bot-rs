[package]
name = "seqscope-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "seqscope's local server: the collector (feed or replay -> rules -> database) plus the HTTP/WebSocket API and the embedded web UI. Localhost only by default."

[dependencies]
alloy = { workspace = true, features = ["k256"] }
anyhow = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
mev-sequencer = { workspace = true }
seqscope-core = { workspace = true }
seqscope-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
tokio-tungstenite = { workspace = true }
tower = { version = "0.5", features = ["util"] }
mev-protocol-uniswap-router = { workspace = true }
