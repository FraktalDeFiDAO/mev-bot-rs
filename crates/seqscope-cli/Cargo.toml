[package]
name = "seqscope-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "seqscope command line: watch the Arbitrum sequencer feed through rules, store matches, query and tune them."

[[bin]]
name = "seqscope"
path = "src/main.rs"

[dependencies]
alloy = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
mev-decode = { workspace = true, default-features = false }
mev-sequencer = { workspace = true }
seqscope-core = { workspace = true }
seqscope-server = { workspace = true }
seqscope-store = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
tokio-tungstenite = { workspace = true }
mev-protocol-uniswap-router = { workspace = true }
