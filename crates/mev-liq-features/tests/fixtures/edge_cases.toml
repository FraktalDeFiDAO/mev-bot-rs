# Fixture: health-factor and debt band edge cases for copper_liq_features_v1.
#
# Provenance: SYNTHETIC boundary values derived from the Aave V3 definitions (health factor is a
# WAD, liquidatable strictly below 1e18; base currency is USD with 8 decimals on Arbitrum One,
# chain id 42161). No on-chain fetch was made for this fixture (no hosted RPC is called by this
# task); values are exact integers so each row sits on, or one unit below, an edge.
# Changing a threshold in crates/mev-liq-features/src/bands.rs must change these rows.

[[hf]]
name = "one_wei_below_liquidation"
hf_wad = "999999999999999999"
band = "below_1.00"

[[hf]]
name = "exactly_one"
hf_wad = "1000000000000000000"
band = "1.00_to_1.02"

[[hf]]
name = "one_wei_below_1_02"
hf_wad = "1019999999999999999"
band = "1.00_to_1.02"

[[hf]]
name = "exactly_1_02"
hf_wad = "1020000000000000000"
band = "1.02_to_1.05"

[[hf]]
name = "exactly_1_05"
hf_wad = "1050000000000000000"
band = "1.05_to_1.10"

[[hf]]
name = "exactly_1_10"
hf_wad = "1100000000000000000"
band = "1.10_to_1.25"

[[hf]]
name = "exactly_1_25"
hf_wad = "1250000000000000000"
band = "1.25_to_2.00"

[[hf]]
name = "one_wei_below_2"
