[package]
name = "mev-liq-features"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Versioned, redacted, as-of liquidation watchlist features for the Jev advisor (JEV-LIQ-007). Pure: no I/O, no network."

[dependencies]
# Lean alloy: primitives only. The workspace alloy enables signer-local/providers, which Process B must not link (spec invariant 7).
alloy = { version = "2.5", default-features = false, features = ["std"] }
mev-liq-state = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
