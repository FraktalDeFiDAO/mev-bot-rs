[package]
name = "mev-liq-state"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Canonical, exact (U256) borrower account snapshots with a durable SQLite repository and CAS revisions."

[dependencies]
# Lean alloy: primitives only. The workspace alloy enables signer-local/providers, which Process B must not link (spec invariant 7).
alloy = { version = "2.5", default-features = false, features = ["std"] }
rusqlite = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3"

[lib]
doctest = false  # no doc examples: skip the empty doc-test runner
