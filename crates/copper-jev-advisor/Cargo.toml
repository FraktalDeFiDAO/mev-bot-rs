[package]
name = "copper-jev-advisor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Process B of the Jev liquidation advisor (JEV-LIQ-012): async worker that drains the advisor outbox, calls TypeSafe through the resilient client and stores shadow decisions. No keys, no RPC, no executor channel."

[lib]
name = "copper_jev_advisor"
path = "src/lib.rs"

[[bin]]
name = "copper-jev-advisor"
path = "src/main.rs"

[dependencies]
# Lean alloy: primitives only. The workspace alloy enables signer-local/providers, which Process B must not link (spec invariant 7).
alloy = { version = "2.5", default-features = false, features = ["std"] }
clap = { workspace = true }
jev-advisor = { path = "../jev-advisor" }
mev-liq-features = { workspace = true }
mev-liq-state = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }

[dev-dependencies]
# Loopback http:// is a test-only feature of the client; the production binary never enables it.
jev-advisor = { path = "../jev-advisor", features = ["loopback-http"] }
tempfile = "3"
