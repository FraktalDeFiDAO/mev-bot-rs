[package]
name = "mev-metrics"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `jsonl` is the existing event log + counters (needs chrono and mev-types, which pulls the workspace alloy).
# The Prometheus text renderer, registry and listener do not, so the signer-free advisor builds with
# `default-features = false`.
default = ["jsonl"]
jsonl = ["dep:chrono", "dep:mev-types"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, optional = true }
tracing = { workspace = true }
mev-types = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
proptest = { workspace = true }

[lib]
doctest = false  # no doc examples: skip the empty doc-test runner
